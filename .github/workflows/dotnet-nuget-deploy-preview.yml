name: NuGet Deploy Preview

on:
  workflow_dispatch:

env:
  NUGET_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Read Version from csproj
        id: getxml
        uses: mavrosxristoforos/get-xml-info@2.2.1
        with:
          xml-file: ./src/SmartishTable/SmartishTable.csproj
          xpath: //Project//PropertyGroup//Version

      - name: Set Version
        run: |
          echo "VERSION=${{ steps.getxml.outputs.info }}-beta.${{ steps.date.outputs.date }}" >> $GITHUB_ENV

      - name: Echo Version
        run: echo "$VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack \
            src/SmartishTable/SmartishTable.csproj \
            --configuration Release \
            --no-build \
            -p:Version=$VERSION \
            --output ./artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key $NUGET_KEY \
            --skip-duplicate